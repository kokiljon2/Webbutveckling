<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="VHDeS.css">
    <title>VHDeS.se</title>
</head>

<body>
    <h2 id="welcome"></h2>
    <div style="display: flex; gap: 5px;">
        <button id="HyrScooter">Hyra</button>
        <button id="Lämna">Lämna</button>
    </div>
    <p id="Elscooter">Välj hur länge du vill hyra elscooter för:</p>
    <div style="display: flex; gap: 5px;">
        <button id="Hyr30min">30 Minuter</button>
        <button id="Hyr1tim">1 Timme</button>
        <button id="HyrCustom">Custom</button>
    </div>
    <div id="Customtid" style="gap: 5px;">
        <label for="Tim">Timmar:</label>
        <input type="number" min="0" max="2" name="Tim" id="Tim">
        <label for="Min">Minuter:</label>
        <input type="number" min="5" max="60" step="5" name="Min" id="Min">
    </div>
    <p id="PrisTid"></p>
    <button id="Finalhyr"> Hyr Scooter</button>
    <p>Senaste hyrd:</p>
    <p id="senhyr"></p>


    <script>
        //Tar ut URL:en så vi kan hämta 
        const params = new URLSearchParams(window.location.search);
        const text = document.getElementById("welcome");
        let username = params.get('username');
        let pristid;
        let hyrd = false;
        const HyrScooter = document.getElementById('HyrScooter');
        const Lämna = document.getElementById('Lämna');
        const Elscooter = document.getElementById('Elscooter');
        const Hyr30min = document.getElementById('Hyr30min');
        const Hyr1tim = document.getElementById('Hyr1tim');
        const HyrCustom = document.getElementById('HyrCustom');
        const PrisTid = document.getElementById('PrisTid');
        const Finalhyr = document.getElementById('Finalhyr');
        const Customtid = document.getElementById('Customtid');
        const senhyr = document.getElementById('senhyr');

        if (username) {
            text.textContent = `Välkommen ${username}!`;
        }

        HyrScooter.addEventListener('click', function (event) {
            if (hyrd) {
                alert('Du har redan hyrt en Scooter!')
            } else {
                Elscooter.style.display = "block";
                Hyr30min.style.display = "block";
                Hyr1tim.style.display = "block";
                HyrCustom.style.display = "block";
            }
        });

        Lämna.addEventListener('click', function (event) {
            if (hyrd) {
                hyrd = false;
                alert('Du har nu lämnat tillbaks Scootern');
            } else {
                alert('Du har inte hyrt en Scooter än');
            }
        });

        Hyr30min.addEventListener('click', function (event) {
            Hyr1tim.style.display = "none";
            HyrCustom.style.display = "none";
            PrisTid.style.display = "block";
            PrisTid.textContent = "Att hyra en scooter i 30 min kostar 50kr";
            Finalhyr.style.display = "block";
            pristid = 30;
        });
        Hyr1tim.addEventListener('click', function (event) {
            Hyr30min.style.display = "none";
            HyrCustom.style.display = "none";
            PrisTid.style.display = "block";
            PrisTid.textContent = "Att hyra en scooter i 1 timme kostar 100kr";
            Finalhyr.style.display = "block";
            pristid = 1;
        });
        HyrCustom.addEventListener('click', function (event) {
            Hyr30min.style.display = "none";
            Hyr1tim.style.display = "none";
            PrisTid.style.display = "block";
            PrisTid.textContent = "Hur länge vill du hyra en elscooter till?";
            Customtid.style.display = "flex";
            Finalhyr.style.display = "block";
            pristid=2;
        });

        Finalhyr.addEventListener('click', function (event) {
            if (pristid == 30) {
                Hyr30min.style.display = "none";
                PrisTid.style.display = "none";
                alert('Du har hyrt en Scooter för 30 min');
            } else if (pristid == 1) {
                Hyr1tim.style.display = "none";
                PrisTid.style.display = "none";
                alert('Du har hyrt en Scooter för 1 timme');
            }
            hyrd = true;
            if (pristid == 2) {
                Customtid.style.display = "none";
                PrisTid.style.display = "none";
                HyrCustom.style.display = "none";
                let Tim = document.getElementById('Tim').value;
                let Min = document.getElementById('Min').value;
                if(Tim<1 && Min<5){
                    alert(`Det går inte att hyra för 0 timmar och 0 minuter`);
                    hyrd=false;
                }
                else if(Tim<1 && Min>=5){
                    alert(`Du har hyrt en Scooter för ${Min} minuter`);
                    hyrd=true;
                }
                else if(Tim>=1 && Min<5){
                    alert(`Du har hyrt en Scooter för ${Tim} timmar`);
                    hyrd=true;
                }
                else{
                    alert(`Du har hyrt en Scooter för ${Tim} timmar och ${Min} minuter`);
                    hyrd=true;
                }
            }
            Elscooter.style.display = "none";
            Finalhyr.style.display = "none";
            senhyr.textContent=`${tid} ${date}`;
        });

    </script>
</body>

</html>
